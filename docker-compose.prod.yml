services:
  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.docker}
      JWT_EXP: 3600
    volumes:
      - type: bind
        source: ${FAMILY_DATA_ROOT:?Set FAMILY_DATA_ROOT in .env.docker}/postgres
        target: /var/lib/postgresql/data
      - ./scripts/set-docker-role-passwords.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  auth:
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:?Set API_EXTERNAL_URL in .env.docker}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_SITE_URL: ${SITE_URL:?Set SITE_URL in .env.docker}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-http://localhost:3002}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.docker}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL:?Set API_EXTERNAL_URL in .env.docker}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOTRUE_EXTERNAL_GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOTRUE_EXTERNAL_GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${API_EXTERNAL_URL}/callback

  rest:
    image: postgrest/postgrest:v14.18
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.docker}
      PGRST_ADMIN_SERVER_HOST: 127.0.0.1
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_SERVER_PORT: 3000
      PGRST_LOG_LEVEL: warn

  storage:
    image: supabase/storage-api:v1.81.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/status"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
      rest:
        condition: service_started
    environment:
      ANON_KEY: ${SUPABASE_ANON_KEY:?Set SUPABASE_ANON_KEY in .env.docker}
      SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set SUPABASE_SERVICE_ROLE_KEY in .env.docker}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.docker}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      SUPABASE_URL: http://gateway:80
      STORAGE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:?Set SUPABASE_PUBLIC_URL in .env.docker}
      FILE_SIZE_LIMIT: 10485760
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: family-system
      REGION: local
      GLOBAL_S3_BUCKET: family-system
      ENABLE_IMAGE_TRANSFORMATION: "false"
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
    volumes:
      - type: bind
        source: ${FAMILY_DATA_ROOT:?Set FAMILY_DATA_ROOT in .env.docker}/storage
        target: /var/lib/storage

  family-init:
    image: supabase/postgres:17.6.1.136
    profiles: ["init"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      storage:
        condition: service_healthy
      rest:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    volumes:
      - ./scripts/init-family.sql:/init-family.sql:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until psql -h db -U postgres -d postgres -Atqc "SELECT to_regclass('auth.users') IS NOT NULL AND to_regclass('storage.objects') IS NOT NULL" | grep -qx t; do sleep 2; done
        if psql -h db -U postgres -d postgres -Atqc "SELECT to_regclass('public.families') IS NOT NULL" | grep -qx t; then
          echo "Family schema already initialized."
          exit 0
        fi
        psql -h db -U postgres -d postgres -v ON_ERROR_STOP=1 --file=/init-family.sql

  gateway:
    image: caddy:2.9.1-alpine
    restart: unless-stopped
    environment:
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:3002}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/auth/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - auth
      - rest
      - storage
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
